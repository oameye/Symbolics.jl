name: Finalize atomic proposal cleanup

on:
  push:
    branches:
      - proposal/atomic-symbolic-numbers

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove duplicate promotion definitions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/num.jl')
          text = path.read_text()
          old = '''Base.promote_rule(::Type{Complex{Num}}, ::Type{Num}) = Complex{Num}
          Base.promote_rule(::Type{Num}, ::Type{Complex{Num}}) = Complex{Num}
          Base.promote_rule(::Type{Num}, ::Type{Complex{Num}}) = Complex{Num}
          Base.promote_rule(::Type{Num}, ::Type{Complex{Num}}) = Complex{Num}
          Base.promote_rule(::Type{Num}, ::Type{Complex{Num}}) = Complex{Num}
          '''
          new = '''Base.promote_rule(::Type{Complex{Num}}, ::Type{Num}) = Complex{Num}
          Base.promote_rule(::Type{Num}, ::Type{Complex{Num}}) = Complex{Num}
          '''
          if old not in text:
              raise SystemExit('expected duplicate promotion block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/finalize-atomic-cleanup.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/num.jl
          git commit -m 'chore: clean atomic complex proposal scaffolding'
          git push origin HEAD:proposal/atomic-symbolic-numbers
