name: Strict Num smoke
on:
  push:
    branches:
      - prototype/strict-num-domain
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.13'
      - name: Enable strict Num invariant
        run: |
          sed -i '0,/@assert symtype(ex) <: Number/s//@assert symtype(ex) <: Real/' src/num.jl
          sed -i '/SymbolicUtils.hashcons(IM, true)/d' src/Symbolics.jl
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Atomic complex probe with strict Num
        run: julia --project=. test/atomic_complex_probe.jl
