name: Apply complex integration fixes
on:
  push:
    branches:
      - proposal/atomic-symbolic-numbers
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply derivative and LinearAlgebra integration
        run: |
          python - <<'PY'
          from pathlib import Path

          # Differential construction and expansion must understand the wide numeric wrapper.
          p = Path('src/diff.jl')
          s = p.read_text()
          ctor = '    Differential(x::Union{Num, Arr}, order = 1) = Differential(unwrap(x), order)\n'
          new_ctor = '    Differential(x::Union{Num, SymbolicNumber, Arr}, order = 1) = Differential(unwrap(x), order)\n'
          if ctor in s:
              s = s.replace(ctor, new_ctor, 1)

          # For a real differentiation variable, real/imag/conj commute with differentiation.
          # For a genuinely complex differentiation variable they are non-holomorphic, so leave
          # the Differential node unevaluated instead of inventing an ordinary complex derivative.
          anchor = '''            elseif f === ifelse || f === ifelse_eager || f === ifelse_branching
          '''
          special = '''            elseif f === conj || f === real || f === imag
                  if symtype(D.x) <: Real
                      inner = executediff(D, args[1]; simplify, throw_no_derivative)
                      return f(inner)
                  end
                  return D(arg)
              elseif f === ifelse || f === ifelse_eager || f === ifelse_branching
          '''
          if anchor in s and special not in s:
              s = s.replace(anchor, special, 1)

          old_expand = '''function expand_derivatives(n::Num, simplify=false; kwargs...)
              Num(expand_derivatives(value(n), simplify; kwargs...))
          end
          '''
          new_expand = '''function expand_derivatives(n::Num, simplify=false; kwargs...)
              wrap(expand_derivatives(value(n), simplify; kwargs...))
          end
          function expand_derivatives(n::SymbolicNumber, simplify=false; kwargs...)
              wrap(expand_derivatives(value(n), simplify; kwargs...))
          end
          '''
          if old_expand in s:
              s = s.replace(old_expand, new_expand, 1)
          p.write_text(s)

          # Generalize symbolic LinearAlgebra from Num/Complex{Num} to all supported wrapped
          # numeric scalars. Explicit Cartesian values remain supported for compatibility.
          p = Path('src/linear_algebra.jl')
          s = p.read_text()
          if 'const WrappedSymbolicNumber = Union{RCNum, SymbolicNumber}\n' not in s:
              s = s.replace(
                  'nterms(t::Num, cache) = nterms(unwrap(t), cache)\n',
                  'nterms(t::Num, cache) = nterms(unwrap(t), cache)\n' +
                  'nterms(t::SymbolicNumber) = nterms(unwrap(t))\n' +
                  'nterms(t::SymbolicNumber, cache) = nterms(unwrap(t), cache)\n\n' +
                  'const WrappedSymbolicNumber = Union{RCNum, SymbolicNumber}\n',
                  1,
              )

          old_lu = '''function sym_lu(A::AbstractMatrix{Num}; check=true)
              nterms_cache = Base.IdDict{SymbolicT, Int}()
              SINGULAR = typemax(Int)
              m, n = size(A)
              F = Matrix{Num}(undef, size(A)...)
          '''
          new_lu = '''function sym_lu(A::AbstractMatrix{T}; check=true) where {T <: WrappedSymbolicNumber}
              nterms_cache = Base.IdDict{SymbolicT, Int}()
              SINGULAR = typemax(Int)
              m, n = size(A)
              F = Matrix{T}(undef, size(A)...)
          '''
          if old_lu in s:
              s = s.replace(old_lu, new_lu, 1)

          s = s.replace('const _SymEltype = Union{BasicSymbolic, RCNum}',
                        'const _SymEltype = Union{BasicSymbolic, WrappedSymbolicNumber}', 1)
          s = s.replace('AbstractMatrix{<:RCNum}', 'AbstractMatrix{<:WrappedSymbolicNumber}')
          s = s.replace('StridedMatrix{<:RCNum}', 'StridedMatrix{<:WrappedSymbolicNumber}')

          old_lex = '''function linear_expansion(t, x::Num)
              a, b, islin = linear_expansion(t, unwrap(x))
              Num(a), Num(b), islin
          end
          '''
          new_lex = '''function linear_expansion(t, x::Num)
              a, b, islin = linear_expansion(t, unwrap(x))
              wrap(a), wrap(b), islin
          end
          '''
          if old_lex in s:
              s = s.replace(old_lex, new_lex, 1)

          old_solve = '__solve(a::Num, b::Num, simplify::Bool) = Num(__solve(unwrap(a), unwrap(b), simplify))\n'
          new_solve = '''function __solve(a::Union{Num, SymbolicNumber}, b::Union{Num, SymbolicNumber}, simplify::Bool)
              wrap(__solve(unwrap(a), unwrap(b), simplify))
          end
          '''
          if old_solve in s:
              s = s.replace(old_solve, new_solve, 1)
          p.write_text(s)

          # The wide-wrapper LU method now lives next to sym_lu, not in wrapper plumbing.
          p = Path('src/symbolic_number.jl')
          s = p.read_text()
          block = '''
          function LinearAlgebra.lu(
                  x::Union{Adjoint{<:SymbolicNumber}, Transpose{<:SymbolicNumber}, Array{<:SymbolicNumber}};
                  check = true, kw...)
              sym_lu(x; check = check)
          end
          '''
          s = s.replace(block, '\n')
          p.write_text(s)
          PY
          if git diff --quiet -- src; then
            echo 'Already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/diff.jl src/linear_algebra.jl src/symbolic_number.jl
          git commit -m 'fix: integrate atomic complex scalars across differentiation and linear algebra'
          git push
