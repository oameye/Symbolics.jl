name: Complex issue regression matrix
on:
  push:
    branches:
      - proposal/atomic-symbolic-numbers
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.13'
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Historical complex regressions
        run: julia --project=. test/complex_issue_regressions.jl
