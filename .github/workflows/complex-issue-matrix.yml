name: Complex issue regression matrix
on:
  push:
    branches:
      - proposal/atomic-symbolic-numbers
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.13'
      - name: Instantiate stacked complex implementation
        run: >-
          julia --project=. -e 'using Pkg;
          Pkg.add(PackageSpec(url="https://github.com/oameye/SymbolicUtils.jl",
          rev="10ebd6183a7c98b707f1417ce026d39a41e074e9"));
          Pkg.instantiate()'
      - name: Historical complex regressions
        run: julia --project=. test/complex_issue_regressions.jl
      - name: Extended complex regressions
        run: julia --project=. test/complex_issue_regressions_extended.jl
